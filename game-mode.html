<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mido | Game Mode</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game-mode-page">

    <header class="top-bar">

        <a href="index.html" class="top-button">
            BACK
        </a>

        <div class="top-title">
            MIDO
        </div>

        <a href="settings.html" class="top-button">
            SETTINGS
        </a>

    </header>


    <main class="mode-container">

        <div class="mode-label">
            START A NEW GAME
        </div>

        <h1>
            CHOOSE YOUR OPPONENT
        </h1>

        <p class="mode-description">
            Select how you want to play.
        </p>


        <div class="mode-options">

            <button
                type="button"
                class="mode-card"
                id="humanHumanButton">

                <div class="mode-icon">
                    2
                </div>

                <div class="mode-card-content">

                    <div class="mode-card-title">
                        PLAYER VS PLAYER
                    </div>

                    <div class="mode-card-text">
                        Challenge another player
                        on the same device.
                    </div>

                </div>

                <div class="mode-card-arrow">
                    >
                </div>

            </button>


            <button
                type="button"
                class="mode-card"
                id="androidButton">

                <div class="mode-icon">
                    A
                </div>

                <div class="mode-card-content">

                    <div class="mode-card-title">
                        PLAYER VS ANDROID
                    </div>

                    <div class="mode-card-text">
                        Test your strategy
                        against Android.
                    </div>

                </div>

                <div class="mode-card-arrow">
                    >
                </div>

            </button>

        </div>


        <div
            class="difficulty-panel"
            id="difficultyPanel">

            <div class="difficulty-label">
                CHOOSE ANDROID LEVEL
            </div>

            <div class="difficulty-options">

                <button
                    type="button"
                    class="difficulty-card"
                    data-difficulty="easy">

                    <span class="difficulty-name">
                        EASY
                    </span>

                    <span class="difficulty-description">
                        A relaxed opponent
                    </span>

                </button>


                <button
                    type="button"
                    class="difficulty-card"
                    data-difficulty="medium">

                    <span class="difficulty-name">
                        MEDIUM
                    </span>

                    <span class="difficulty-description">
                        A serious challenge
                    </span>

                </button>


                <button
                    type="button"
                    class="difficulty-card"
                    data-difficulty="hard">

                    <span class="difficulty-name">
                        HARD
                    </span>

                    <span class="difficulty-description">
                        Play at your own risk
                    </span>

                </button>

            </div>

        </div>


        <div class="mode-rule">

            <span>
                MIDO
            </span>

            <span>
                48 STONES TO VICTORY
            </span>

        </div>

    </main>


    <footer class="mido-footer">

        <div class="footer-logo">
            MIDO
        </div>

        <p>
            An Indigenous African Strategy Game
        </p>

        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="game-mode.html">
                Play
            </a>

            <a href="settings.html">
                Settings
            </a>

        </div>

        <p class="footer-copy">
            Mido Game
        </p>

    </footer>

</div>


<script>

    const humanHumanButton =
        document.getElementById(
            "humanHumanButton"
        );

    const androidButton =
        document.getElementById(
            "androidButton"
        );

    const difficultyPanel =
        document.getElementById(
            "difficultyPanel"
        );


    humanHumanButton.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "midoGameMode",
                "human-human"
            );

            localStorage.removeItem(
                "midoDifficulty"
            );

            window.location.href =
                "game.html";

        }
    );


    androidButton.addEventListener(
        "click",
        function () {

            difficultyPanel.classList.toggle(
                "show"
            );

        }
    );


    const difficultyButtons =
        document.querySelectorAll(
            ".difficulty-card"
        );


    difficultyButtons.forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    const difficulty =
                        button.dataset.difficulty;

                    localStorage.setItem(
                        "midoGameMode",
                        "human-android"
                    );

                    localStorage.setItem(
                        "midoDifficulty",
                        difficulty
                    );

                    window.location.href =
                        "game.html";

                }
            );

        }
    );

</script>

</body>

</html>
